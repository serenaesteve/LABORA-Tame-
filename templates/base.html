<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}TAME – Selección FPO{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --azul:     #5a7f8f;
    --azul-d:   #3d5f6e;
    --azul-xl:  #2a4a58;
    --dorado:   #b5a050;
    --dorado-l: #d4bc6a;
    --dorado-xl:#e8d48a;
    --blanco:   #ffffff;
    --gris-f:   #f5f4f1;
    --gris-l:   #e4e3df;
    --gris-t:   #888880;
    --negro:    #1a1a18;
    --verde:    #3d6b4a;
    --rojo:     #9a3535;
    --naranja:  #a86828;
    --grad-hero: linear-gradient(135deg, #2a4a58 0%, #3d5f6e 50%, #5a7f8f 100%);
    --grad-gold: linear-gradient(135deg, #b5a050 0%, #d4bc6a 100%);
    --grad-card: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(247,247,245,0.6) 100%);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    --shadow-gold: 0 4px 20px rgba(181,160,80,0.25);
    --shadow-azul: 0 4px 20px rgba(90,127,143,0.3);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--gris-f);
    color: var(--negro);
    min-height: 100vh;
  }

  /* ── FONDO CON PATRÓN SUTIL ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(90,127,143,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(181,160,80,0.05) 0%, transparent 60%),
      var(--gris-f);
  }

  /* ── NAV GLASSMORPHISM ── */
  nav {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid rgba(228,227,223,0.8);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6), var(--shadow-sm);
  }
  .nav-logo img { height: 42px; transition: opacity 0.2s; }
  .nav-logo img:hover { opacity: 0.85; }

  .nav-links { display: flex; align-items: center; gap: 0.25rem; }
  .nav-links a {
    text-decoration: none; color: var(--azul-d);
    font-size: 0.84rem; font-weight: 500;
    padding: 0.45rem 0.9rem; border-radius: 8px;
    transition: background 0.18s, color 0.18s;
    letter-spacing: 0.01em;
  }
  .nav-links a:hover { background: rgba(90,127,143,0.1); color: var(--azul-xl); }
  .nav-user {
    font-size: 0.78rem; color: var(--gris-t);
    font-weight: 400; letter-spacing: 0.02em;
  }
  .nav-links a.btn-nav {
    background: var(--grad-hero);
    color: white; font-weight: 600;
    box-shadow: var(--shadow-azul);
    padding: 0.45rem 1.1rem;
  }
  .nav-links a.btn-nav:hover {
    box-shadow: 0 6px 24px rgba(90,127,143,0.4);
    transform: translateY(-1px);
  }

  /* Buscador nav */
  .nav-search input {
    padding: 0.38rem 0.75rem;
    border: 1.5px solid var(--gris-l);
    border-radius: 20px;
    font-size: 0.82rem;
    width: 155px;
    font-family: 'DM Sans', sans-serif;
    background: rgba(255,255,255,0.7);
    transition: width 0.25s, border-color 0.2s, box-shadow 0.2s;
  }
  .nav-search input:focus {
    outline: none; width: 200px;
    border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(90,127,143,0.12);
    background: white;
  }
  .nav-search button {
    background: none; border: none; cursor: pointer;
    font-size: 0.95rem; padding: 0.2rem 0.3rem;
    opacity: 0.6; transition: opacity 0.2s;
  }
  .nav-search button:hover { opacity: 1; }

  /* ── MAIN ── */
  main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem; }

  /* ── HEADING ── */
  .page-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem; font-weight: 600;
    background: linear-gradient(135deg, var(--azul-xl) 0%, var(--azul) 60%, var(--dorado) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    padding-bottom: 0.5rem;
    margin-bottom: 2rem;
    display: inline-block;
    position: relative;
  }
  .page-title::after {
    content: '';
    position: absolute; bottom: 0; left: 0;
    width: 100%; height: 2px;
    background: var(--grad-gold);
    border-radius: 2px;
  }

  /* ── CARDS ── */
  .card {
    background: white;
    border: 1px solid var(--gris-l);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s, transform 0.25s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    pointer-events: none;
  }
  .card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-3px);
  }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.55rem 1.25rem; border-radius: 10px;
    border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
    letter-spacing: 0.01em;
    position: relative; overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.18s;
  }
  .btn:hover::after { background: rgba(255,255,255,0.12); }

  .btn-primary {
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-d) 100%);
    color: white;
    box-shadow: var(--shadow-azul);
  }
  .btn-primary:hover {
    box-shadow: 0 6px 24px rgba(90,127,143,0.4);
    transform: translateY(-1px);
  }
  .btn-gold {
    background: var(--grad-gold);
    color: white;
    box-shadow: var(--shadow-gold);
  }
  .btn-gold:hover {
    box-shadow: 0 6px 24px rgba(181,160,80,0.4);
    transform: translateY(-1px);
  }
  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--azul);
    color: var(--azul);
  }
  .btn-outline:hover {
    background: var(--azul);
    color: white;
    box-shadow: var(--shadow-azul);
    transform: translateY(-1px);
  }
  .btn-danger {
    background: linear-gradient(135deg, var(--rojo), #7a2525);
    color: white;
    box-shadow: 0 4px 16px rgba(154,53,53,0.25);
  }
  .btn-danger:hover { box-shadow: 0 6px 24px rgba(154,53,53,0.4); transform: translateY(-1px); }
  .btn-sm { padding: 0.38rem 0.85rem; font-size: 0.78rem; border-radius: 8px; }

  /* ── BADGES ── */
  .badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.28rem 0.8rem; border-radius: 20px;
    font-size: 0.74rem; font-weight: 600; white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .badge-pendiente    { background: rgba(136,136,128,0.1); color: var(--gris-t); border: 1px solid rgba(136,136,128,0.2); }
  .badge-seleccionado { background: rgba(61,107,74,0.1);  color: var(--verde);  border: 1px solid rgba(61,107,74,0.25); }
  .badge-reserva      { background: rgba(168,104,40,0.1); color: var(--naranja); border: 1px solid rgba(168,104,40,0.25); }
  .badge-no_seleccionado { background: rgba(154,53,53,0.08); color: var(--rojo); border: 1px solid rgba(154,53,53,0.2); }

  /* ── FORMS ── */
  .form-group { margin-bottom: 1.2rem; }
  .form-group label {
    display: block; font-size: 0.78rem; font-weight: 600;
    color: var(--azul-d); margin-bottom: 0.35rem;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 0.65rem 0.95rem;
    border: 1.5px solid var(--gris-l); border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
    background: white; color: var(--negro);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(90,127,143,0.12);
  }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  .form-section {
    background: white; border-radius: 14px;
    padding: 1.4rem; margin-bottom: 1.5rem;
    border: 1px solid var(--gris-l);
    border-left: 4px solid var(--dorado);
    box-shadow: var(--shadow-sm);
  }
  .form-section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; font-weight: 600; color: var(--azul-d);
    margin-bottom: 1rem;
  }

  /* ── TABLA ── */
  .tabla { width: 100%; border-collapse: collapse; }
  .tabla th {
    background: linear-gradient(180deg, var(--gris-f) 0%, rgba(245,244,241,0.5) 100%);
    color: var(--azul-d);
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
    padding: 0.85rem 1rem; text-align: left;
    border-bottom: 2px solid var(--gris-l);
  }
  .tabla td {
    padding: 0.9rem 1rem; border-bottom: 1px solid rgba(228,227,223,0.7);
    font-size: 0.875rem; vertical-align: middle;
    transition: background 0.15s;
  }
  .tabla tr:hover td { background: rgba(90,127,143,0.04); }
  .tabla tr:last-child td { border-bottom: none; }

  /* ── SCORE CIRCLE ── */
  .score-circle {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem;
    background: var(--gris-f); color: var(--gris-t);
    border: 2px solid var(--gris-l);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
    transition: transform 0.2s;
  }
  .score-circle:hover { transform: scale(1.1); }
  .score-circle.high {
    background: linear-gradient(135deg, #d4f0de, #e8f4ec);
    color: var(--verde); border-color: rgba(61,107,74,0.3);
    box-shadow: 0 2px 8px rgba(61,107,74,0.2);
  }
  .score-circle.mid {
    background: linear-gradient(135deg, #fef0d4, #fef6e4);
    color: var(--naranja); border-color: rgba(168,104,40,0.3);
    box-shadow: 0 2px 8px rgba(168,104,40,0.2);
  }
  .score-circle.low {
    background: linear-gradient(135deg, #f8d4d4, #faeaea);
    color: var(--rojo); border-color: rgba(154,53,53,0.3);
    box-shadow: 0 2px 8px rgba(154,53,53,0.15);
  }

  /* ── ALERTS ── */
  .alert {
    padding: 0.9rem 1.2rem; border-radius: 10px;
    margin-bottom: 1.5rem; font-size: 0.875rem;
    display: flex; align-items: flex-start; gap: 0.6rem;
    border: 1px solid transparent;
  }
  .alert-error { background: rgba(154,53,53,0.07); color: var(--rojo); border-color: rgba(154,53,53,0.2); }
  .alert-success { background: rgba(61,107,74,0.07); color: var(--verde); border-color: rgba(61,107,74,0.2); }

  /* ── STAT BOXES ── */
  .stats-row { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .stat-box {
    flex: 1; min-width: 110px;
    background: white;
    border: 1px solid var(--gris-l);
    border-radius: 14px; padding: 1.1rem 1rem;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative; overflow: hidden;
  }
  .stat-box::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
    background: var(--gris-l);
    border-radius: 0 0 14px 14px;
  }
  .stat-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-box .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem; font-weight: 600; color: var(--azul-d); line-height: 1;
  }
  .stat-box .stat-label {
    font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--gris-t); margin-top: 0.35rem;
    font-weight: 500;
  }

  /* ── RADIO GROUPS ── */
  .radio-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .radio-group label {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.4rem 0.85rem; border-radius: 8px;
    border: 1.5px solid var(--gris-l); cursor: pointer;
    font-size: 0.84rem; font-weight: 400;
    text-transform: none; letter-spacing: 0; color: var(--negro);
    transition: all 0.15s; background: white;
  }
  .radio-group label:hover { border-color: var(--azul); background: rgba(90,127,143,0.04); }
  .radio-group input[type=radio] { accent-color: var(--azul); }
  .radio-group label:has(input:checked) {
    border-color: var(--azul);
    background: rgba(90,127,143,0.08);
    color: var(--azul-d); font-weight: 500;
  }

  /* ── SPINNER ── */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── RANK POS ── */
  .rank-pos {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; font-weight: 600;
    background: var(--grad-gold);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    width: 36px; text-align: center;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 2rem;
    color: var(--gris-t); font-size: 0.75rem;
    border-top: 1px solid var(--gris-l); margin-top: 4rem;
    background: rgba(255,255,255,0.5);
    letter-spacing: 0.02em;
  }
  footer span { color: var(--dorado); font-weight: 500; }

  /* ── TABLA WRAP ── */
  .tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ── NAV HAMBURGER ── */
  .nav-toggle {
    display: none; background: none; border: none; cursor: pointer;
    font-size: 1.4rem; color: var(--azul-d); padding: 0.3rem; line-height: 1;
  }
  .nav-right { display: flex; align-items: center; gap: 1rem; }

  /* ── ANIMACIÓN ENTRADA ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  main > * { animation: fadeUp 0.35s ease both; }
  main > *:nth-child(2) { animation-delay: 0.05s; }
  main > *:nth-child(3) { animation-delay: 0.1s; }
  main > *:nth-child(4) { animation-delay: 0.15s; }

  /* ── TABLET (≤ 900px) ── */
  @media (max-width: 900px) {
    main { padding: 1.8rem 1.2rem; }
    .form-grid-3 { grid-template-columns: 1fr 1fr; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .page-title { font-size: 1.9rem; }
  }

  /* ── MÓVIL (≤ 640px) ── */
  @media (max-width: 640px) {
    nav { padding: 0 1rem; height: 60px; }
    .nav-logo img { height: 34px; }
    .nav-toggle { display: block; }
    .nav-right {
      display: none; position: absolute; top: 60px; left: 0; right: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gris-l);
      flex-direction: column; align-items: flex-start; gap: 0;
      padding: 0.75rem 1rem 1rem; z-index: 99;
      box-shadow: var(--shadow-md);
    }
    .nav-right.open { display: flex; }
    .nav-user { margin-right: 0; margin-bottom: 0.5rem; }
    .nav-links { flex-direction: column; width: 100%; gap: 0.25rem; }
    .nav-links a { width: 100%; padding: 0.65rem 0.75rem; border-radius: 10px; }
    main { padding: 1.2rem 0.85rem; }
    .page-title { font-size: 1.6rem; }
    .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .stat-box { padding: 0.75rem; }
    .stat-box .stat-num { font-size: 1.7rem; }
    .card { padding: 1rem; }
    .card:hover { transform: none; }
    .tabla th, .tabla td { padding: 0.6rem 0.7rem; font-size: 0.82rem; }
    .btn { padding: 0.6rem 1rem; }
    .btn-sm { padding: 0.5rem 0.85rem; font-size: 0.8rem; }
    footer { padding: 1.2rem; margin-top: 2.5rem; }
  }
</style>
</head>
<body>
{% if session.user_id %}
<nav>
  <a class="nav-logo" href="{{ url_for('dashboard') }}">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="TAME Formación">
  </a>
  <button class="nav-toggle" id="nav-toggle" aria-label="Menú">☰</button>
  <div class="nav-right" id="nav-right">
    <span class="nav-user">{{ session.user_nombre }}</span>
    <form class="nav-search" action="{{ url_for('buscar_global') }}" method="GET"
          style="display:flex;align-items:center;gap:0.2rem;">
      <input type="text" name="q" placeholder="Buscar alumno…">
      <button type="submit">🔍</button>
    </form>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('nuevo_curso') }}" class="btn-nav">+ Nuevo curso</a>
      <a href="{{ url_for('logout') }}">Salir</a>
    </div>
  </div>
</nav>
<script>
  document.getElementById('nav-toggle').addEventListener('click', function() {
    document.getElementById('nav-right').classList.toggle('open');
  });
</script>
{% endif %}
<main>{% block content %}{% endblock %}</main>
<footer>© 2026 <span>TAME Formación</span> · Mislata Formación S.L. · Sistema de Selección FPO</footer>
</body>
</html>
