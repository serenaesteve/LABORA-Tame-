<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción enviada – TAME</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--azul:#5a7f8f;--dorado:#b5a050;--blanco:#fff;--gris-f:#f7f7f5;--gris-l:#e8e8e4;--gris-t:#888880;--negro:#1a1a18;--verde:#4a7c59;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--gris-f);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
  .box{background:var(--blanco);border:1px solid var(--gris-l);border-radius:16px;padding:3rem;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.08);}
  .check{width:64px;height:64px;border-radius:50%;background:#e8f4ec;border:3px solid #b8ddc4;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1.5rem;}
  h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--negro);margin-bottom:0.5rem;}
  p{color:var(--gris-t);font-size:0.9rem;line-height:1.6;}
  .curso{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--azul);margin:1rem 0;font-style:italic;}
  img{height:40px;margin-bottom:2rem;}
</style>
</head>
<body>
<div class="box">
  <img src="{{ url_for('static', filename='logo.png') }}" alt="TAME">
  <div class="check">✓</div>
  <h1>Inscripción recibida</h1>
  <div class="curso">{{ curso.nombre }}</div>
  <p>Su solicitud ha sido registrada correctamente. El equipo de TAME Formación se pondrá en contacto con usted para informarle del resultado de la selección.</p>
  <p style="margin-top:1rem;font-size:0.8rem;">© 2025 TAME Formación · Mislata Formación S.L.</p>
</div>
</body>
</html>
